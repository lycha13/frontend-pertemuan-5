<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah dan Kelola Produk</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <main class="container">
        <nav>
            <a href="index_1.html" class="active">Tambah / Edit Produk</a>
            <a href="produk-card.html">Daftar Produk (Card & Console)</a>
        </nav>

        <header class="page-header">
            <h1>Kelola Produk Elektronik</h1>
            <p>Tambah, edit, hapus, dan cari produk dalam satu halaman.</p>
        </header>

        <section class="form-section">
            <h2>Form Data Produk</h2>
            <form id="product-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="product-name">Nama Produk</label>
                        <input type="text" id="product-name" required placeholder="Contoh: Laptop Lenovo">
                    </div>
                    <div class="form-group">
                        <label for="product-category">Kategori Produk</label>
                        <select id="product-category" required>
                            <option value="">-- Pilih Kategori --</option>
                            <option value="Laptop & Komputer">Laptop & Komputer</option>
                            <option value="Smartphone & Tablet">Smartphone & Tablet</option>
                            <option value="Audio & Musik">Audio & Musik</option>
                            <option value="Kamera & Fotografi">Kamera & Fotografi</option>
                            <option value="Televisi & Display">Televisi & Display</option>
                            <option value="Periferal & Aksesoris">Periferal & Aksesoris</option>
                            <option value="Peralatan Rumah Tangga">Peralatan Rumah Tangga</option>
                            <option value="Komponen Hardware">Komponen Hardware</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="product-price">Harga (Rp)</label>
                        <input type="number" id="product-price" required min="1" step="1" placeholder="Contoh: 7500000">
                    </div>
                    <div class="form-group">
                        <label for="product-stock">Jumlah Stok</label>
                        <input type="number" id="product-stock" required min="0" step="1" placeholder="Contoh: 5">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" id="form-submit-btn" class="btn btn-primary">Simpan Produk Baru</button>
                    <button type="button" id="cancel-edit-btn" class="btn btn-secondary" onclick="location.reload()">Bersihkan Form</button>
                </div>
            </form>
            <div id="form-feedback" class="feedback-msg" role="status"></div>

            <div class="live-preview">
                <h3>Live Preview Data Masukan</h3>
                <p><strong>Nama:</strong> <span id="prev-name">...</span></p>
                <p><strong>Kategori:</strong> <span id="prev-category">...</span></p>
                <p><strong>Harga:</strong> <span id="prev-price">Rp 0</span></p>
                <p><strong>Stok:</strong> <span id="prev-stock">0</span></p>
            </div>
        </section>

        <section class="data-section">
            <div class="section-heading">
                <h2>Daftar Produk</h2>
                <input type="search" id="search-input" placeholder="Cari nama atau kategori produk...">
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Nama</th><th>Kategori</th><th>Harga</th><th>Stok</th><th>Aksi</th></tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="assets/js/dom_renderer.js"></script>
</body>
</html>
